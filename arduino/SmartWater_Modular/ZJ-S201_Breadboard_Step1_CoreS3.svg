<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#0b2b50}.subtitle{font:600 21px Arial,sans-serif;fill:#34516e}
      .label{font:700 19px Arial,sans-serif;fill:#142638}.small{font:600 16px Arial,sans-serif;fill:#26394b}
      .tiny{font:600 13px Arial,sans-serif;fill:#435466}.hole{fill:#d4d8dc;stroke:#8d969f;stroke-width:1}
      .board{fill:#fafafa;stroke:#aeb8c1;stroke-width:3}.wire{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:10}
      .lead{fill:none;stroke:#59636c;stroke-width:4}.callout{fill:#fff;stroke-width:3;rx:12}.row{font:700 16px Arial,sans-serif;fill:#34495e}
    </style>
    <pattern id="upperHoles" width="28" height="40" patternUnits="userSpaceOnUse">
      <circle class="hole" cx="14" cy="20" r="5"/>
    </pattern>
    <pattern id="railHoles" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle class="hole" cx="14" cy="14" r="5"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#f3f6fa"/>
  <text x="800" y="58" text-anchor="middle" class="title">STEP 1 — CONNECT THE CORES3 AND RESISTORS</text>
  <text x="800" y="91" text-anchor="middle" class="subtitle">Use the upper A–E strip and the left power-rail section only</text>

  <!-- breadboard -->
  <rect x="110" y="145" width="1080" height="565" rx="18" class="board"/>
  <text x="145" y="178" class="label" fill="#1874c9">−</text>
  <line x1="165" y1="174" x2="1030" y2="174" stroke="#1f8ed4" stroke-width="5"/>
  <rect x="150" y="183" width="896" height="28" fill="url(#railHoles)"/>
  <text x="145" y="237" class="label" fill="#e33b3b">+</text>
  <line x1="165" y1="233" x2="1030" y2="233" stroke="#e84646" stroke-width="5"/>
  <rect x="150" y="242" width="896" height="28" fill="url(#railHoles)"/>

  <rect x="150" y="315" width="896" height="200" fill="url(#upperHoles)"/>
  <rect x="150" y="555" width="896" height="120" fill="url(#upperHoles)" opacity=".55"/>
  <rect x="135" y="520" width="925" height="28" rx="12" fill="#e8edf2"/>

  <!-- row labels -->
  <g class="row"><text x="123" y="340">A</text><text x="123" y="380">B</text><text x="123" y="420">C</text><text x="123" y="460">D</text><text x="123" y="500">E</text>
  <text x="123" y="580">F</text><text x="123" y="620">G</text><text x="123" y="660">H</text></g>

  <!-- column numbers and guides: x(n)=164+28(n-1) -->
  <g class="small" text-anchor="middle">
    <text x="164" y="302">1</text><text x="276" y="302">5</text><text x="416" y="302">10</text>
    <text x="556" y="302">15</text><text x="696" y="302">20</text><text x="836" y="302">25</text><text x="976" y="302">30</text>
  </g>
  <line x1="1000" y1="145" x2="1000" y2="710" stroke="#e02035" stroke-width="4" stroke-dasharray="12 9"/>
  <rect x="873" y="111" width="256" height="52" rx="10" fill="#fff" stroke="#e02035" stroke-width="3"/>
  <text x="1001" y="133" text-anchor="middle" class="small" fill="#c5162e">RAIL BREAK NEAR 30/31</text>
  <text x="1001" y="153" text-anchor="middle" class="tiny" fill="#c5162e">Do not place any connection to its right</text>

  <!-- highlights -->
  <rect x="402" y="313" width="28" height="202" rx="12" fill="#1aa56b" opacity=".19" stroke="#078957" stroke-width="3"/>
  <rect x="542" y="313" width="28" height="202" rx="12" fill="#7749d9" opacity=".20" stroke="#6534ca" stroke-width="3"/>
  <text x="416" y="538" text-anchor="middle" class="tiny" fill="#078957">COLUMN 10</text>
  <text x="556" y="538" text-anchor="middle" class="tiny" fill="#6534ca">SHARED NODE</text>

  <!-- 10k resistor A10 to A15 -->
  <line x1="416" y1="335" x2="445" y2="335" class="lead"/>
  <path d="M445 335 l12 -12 14 24 14 -24 14 24 14 -24 14 24 12 -12" fill="none" stroke="#9b5f22" stroke-width="7"/>
  <line x1="539" y1="335" x2="556" y2="335" class="lead"/>
  <circle cx="416" cy="335" r="7" fill="#9b5f22"/><circle cx="556" cy="335" r="7" fill="#9b5f22"/>
  <rect x="428" y="278" width="120" height="40" class="callout" stroke="#9b5f22"/>
  <text x="488" y="304" text-anchor="middle" class="small">10 kΩ: A10→A15</text>

  <!-- 20k resistor D15 to D20 -->
  <line x1="556" y1="455" x2="585" y2="455" class="lead"/>
  <path d="M585 455 l12 -12 14 24 14 -24 14 24 14 -24 14 24 12 -12" fill="none" stroke="#287eb7" stroke-width="7"/>
  <line x1="679" y1="455" x2="696" y2="455" class="lead"/>
  <circle cx="556" cy="455" r="7" fill="#287eb7"/><circle cx="696" cy="455" r="7" fill="#287eb7"/>
  <rect x="580" y="470" width="150" height="40" class="callout" stroke="#287eb7"/>
  <text x="655" y="496" text-anchor="middle" class="small">20 kΩ: D15→D20</text>

  <!-- E20 to blue rail jumper -->
  <path d="M696 495 C760 455 770 260 696 197" class="wire" stroke="#161b20"/>
  <circle cx="696" cy="495" r="7" fill="#111"/><circle cx="696" cy="197" r="7" fill="#111"/>
  <rect x="718" y="365" width="252" height="45" class="callout" stroke="#161b20"/>
  <text x="844" y="393" text-anchor="middle" class="small">BLACK JUMPER: E20→GND RAIL</text>

  <!-- CoreS3 -->
  <rect x="1260" y="208" width="270" height="370" rx="32" fill="#f7f7f4" stroke="#9da9b3" stroke-width="5"/>
  <rect x="1288" y="240" width="214" height="270" rx="16" fill="#17202a"/>
  <text x="1395" y="292" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#fff">M5Stack</text>
  <text x="1395" y="337" text-anchor="middle" font-family="Arial" font-size="40" font-weight="800" fill="#ffb52b">CoreS3</text>
  <rect x="1270" y="365" width="36" height="125" rx="8" fill="#ed315d"/>
  <text x="1288" y="432" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff" transform="rotate(-90 1288 432)">PORT A</text>

  <!-- continuous CoreS3 wires -->
  <path d="M1270 420 C1140 420 1090 270 780 255 C748 255 748 245 752 255" class="wire" stroke="#e52b2f"/>
  <circle cx="752" cy="255" r="7" fill="#e52b2f"/>
  <path d="M1270 390 C1110 390 1095 185 752 197" class="wire" stroke="#15191d"/>
  <circle cx="752" cy="197" r="7" fill="#15191d"/>
  <path d="M1270 450 C1120 450 980 375 556 375" class="wire" stroke="#f9f9f4" style="filter:drop-shadow(0 0 2px #64717d)"/>
  <circle cx="556" cy="375" r="8" fill="#fff" stroke="#5c6974" stroke-width="3"/>
  <path d="M1270 480 C1310 500 1330 520 1370 540" class="wire" stroke="#f2c21e"/>
  <rect x="1360" y="530" width="72" height="32" rx="6" fill="#f6d953" stroke="#b98a00" stroke-width="2"/>

  <!-- wire labels -->
  <rect x="1080" y="125" width="450" height="64" class="callout" stroke="#597087"/>
  <text x="1100" y="151" class="small" fill="#d51f28">RED = 5V → top red rail near column 22</text>
  <text x="1100" y="177" class="small">BLACK = GND → top blue rail near column 22</text>
  <rect x="1020" y="586" width="510" height="116" class="callout" stroke="#7749d9"/>
  <text x="1040" y="615" class="small" fill="#4b5560">WHITE = GPIO2 → B15 (shared node)</text>
  <text x="1040" y="644" class="small" fill="#b18400">YELLOW = GPIO1 → NOT USED; cap/tape it</text>
  <text x="1040" y="678" class="small" fill="#c5162e">Power must be OFF while moving wires.</text>

  <!-- exact-hole summary -->
  <rect x="110" y="742" width="1420" height="116" rx="14" fill="#fff" stroke="#9eacb9" stroke-width="3"/>
  <text x="135" y="773" class="label">Exact holes:</text>
  <text x="265" y="773" class="small">10k resistor A10–A15  •  Core WHITE GPIO2 B15  •  20k resistor D15–D20  •  black jumper E20–blue GND rail</text>
  <text x="135" y="811" class="small">Core RED and BLACK enter the left power-rail segment near column 22. Core YELLOW GPIO1 stays disconnected.</text>
  <text x="135" y="841" class="tiny">Within one numbered column, A–E are electrically connected. Different numbered columns are not connected unless a component bridges them.</text>
</svg>
